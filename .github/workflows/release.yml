name: Release builds

# Builds downloadable desktop packages and publishes them to a public GitHub
# Release:
#   * Windows        -> Stitch-Hero-Setup-<ver>.exe        (Inno Setup)
#   * macOS Apple Si -> Stitch-Hero-<ver>-macOS-arm64.dmg  (drag to /Apps)
#   * macOS Intel    -> Stitch-Hero-<ver>-macOS-x86_64.dmg
#   * The user manual (docs/Stitch-Hero-Manual.pdf) is attached too.
#
# Trigger by pushing a tag like v0.2.0, or Actions -> "Release builds" ->
# Run workflow (pick a version; leave "publish" checked to make a Release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (no leading v), e.g. 0.2.0"
        required: true
        default: "0.2.0"
      publish:
        description: "Publish a public GitHub Release (uncheck to only build artifacts)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${{ github.ref_name }}"; VER="${VER#v}"
            PUB=true
          else
            VER="${{ github.event.inputs.version }}"
            PUB="${{ github.event.inputs.publish }}"
          fi
          echo "version=$VER"  >> "$GITHUB_OUTPUT"
          echo "tag=v$VER"     >> "$GITHUB_OUTPUT"
          echo "publish=$PUB"  >> "$GITHUB_OUTPUT"
          echo "version=$VER publish=$PUB"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.5" pyinstaller
          python -m pip install -e .

      - name: Build the app (PyInstaller)
        working-directory: packaging
        run: pyinstaller --noconfirm leather-drafting.spec

      - name: Smoke-test the build
        working-directory: packaging
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath ".\dist\Stitch Hero\Stitch Hero.exe" `
                 -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Smoke test failed ($($p.ExitCode))"; exit 1 }
          Write-Host "smoke test passed"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        working-directory: packaging
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ needs.version.outputs.version }}" installer.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packaging/installer/*.exe
          if-no-files-found: error

  macos:
    needs: version
    # Two native builds: arm64 on the Apple-Silicon runner (macos-14) for
    # M-series Macs, and x86_64 on the Intel runner (macos-13). Both unsigned.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.5" pyinstaller
          python -m pip install -e .

      - name: Build the app (PyInstaller)
        working-directory: packaging
        run: pyinstaller --noconfirm leather-drafting.spec

      - name: Check the build architecture
        working-directory: packaging
        run: |
          BIN="dist/Stitch Hero.app/Contents/MacOS/Stitch Hero"
          file "$BIN"
          lipo -archs "$BIN" | grep -q "${{ matrix.arch }}" \
            || { echo "expected ${{ matrix.arch }}"; exit 1; }

      - name: Smoke-test the build
        working-directory: packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "./dist/Stitch Hero.app/Contents/MacOS/Stitch Hero" --smoke
          echo "smoke test passed"

      - name: Package the .dmg
        working-directory: packaging
        run: |
          VER="${{ needs.version.outputs.version }}"
          STAGE="$(mktemp -d)"
          cp -R "dist/Stitch Hero.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"      # drag-to-install target
          mkdir -p installer
          hdiutil create -volname "Stitch Hero" -srcfolder "$STAGE" \
            -ov -format UDZO \
            "installer/Stitch-Hero-${VER}-macOS-${{ matrix.arch }}.dmg"
          ls -lh installer

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: packaging/installer/*.dmg
          if-no-files-found: error

  release:
    needs: [version, windows, macos]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out (for the bundled manual PDF)
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Stitch Hero ${{ needs.version.outputs.version }}
          files: |
            dist/*.exe
            dist/*.dmg
            docs/Stitch-Hero-Manual.pdf
          generate_release_notes: true
          fail_on_unmatched_files: true
