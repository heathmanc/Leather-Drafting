name: Release builds

# Builds downloadable desktop packages and publishes them to a public GitHub
# Release:
#   * Windows -> Stitch-Hero-Setup-<ver>.exe            (Inno Setup)
#   * macOS   -> Stitch-Hero-<ver>-macOS-universal.dmg  (Intel + Apple Silicon)
#   * The user manual (docs/Stitch-Hero-Manual.pdf) is attached too.
#
# Trigger by pushing a tag like v0.2.0, or Actions -> "Release builds" ->
# Run workflow (pick a version; leave "publish" checked to make a Release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (no leading v), e.g. 0.2.0"
        required: true
        default: "0.2.0"
      publish:
        description: "Publish a public GitHub Release (uncheck to only build artifacts)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${{ github.ref_name }}"; VER="${VER#v}"
            PUB=true
          else
            VER="${{ github.event.inputs.version }}"
            PUB="${{ github.event.inputs.publish }}"
          fi
          echo "version=$VER"  >> "$GITHUB_OUTPUT"
          echo "tag=v$VER"     >> "$GITHUB_OUTPUT"
          echo "publish=$PUB"  >> "$GITHUB_OUTPUT"
          echo "version=$VER publish=$PUB"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.5" pyinstaller
          python -m pip install -e .

      - name: Build the app (PyInstaller)
        working-directory: packaging
        run: pyinstaller --noconfirm leather-drafting.spec

      - name: Smoke-test the build
        working-directory: packaging
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath ".\dist\Stitch Hero\Stitch Hero.exe" `
                 -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Smoke test failed ($($p.ExitCode))"; exit 1 }
          Write-Host "smoke test passed"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        working-directory: packaging
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ needs.version.outputs.version }}" installer.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packaging/installer/*.exe
          if-no-files-found: error

  macos:
    needs: version
    # One universal2 build on the Apple-Silicon runner. GitHub's Intel
    # (macos-13) runners are being retired and jobs targeting them sit
    # "waiting for a runner" forever, so instead of a per-arch matrix we build
    # a single fat app that runs natively on BOTH Intel and Apple Silicon.
    # This needs a fat interpreter (python.org universal2, installed below) and
    # PySide6's universal2 wheels; the result is unsigned.
    runs-on: macos-14
    env:
      # python.org ships a genuine universal2 CPython; actions/setup-python
      # only has thin per-arch builds, which can't produce a fat app.
      PY_VER: "3.12.8"
    steps:
      - uses: actions/checkout@v4

      - name: Install universal2 Python from python.org
        run: |
          curl -fLO "https://www.python.org/ftp/python/${PY_VER}/python-${PY_VER}-macos11.pkg"
          sudo installer -pkg "python-${PY_VER}-macos11.pkg" -target /
          PYBIN="/Library/Frameworks/Python.framework/Versions/3.12/bin"
          echo "$PYBIN" >> "$GITHUB_PATH"
          "$PYBIN/python3" -c "import sys; print(sys.version)"
          # confirm the interpreter itself is fat, else a universal2 app is impossible
          lipo -archs "$PYBIN/python3.12" || lipo -archs "$(readlink -f "$PYBIN/python3")"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "PySide6>=6.5" pyinstaller
          python3 -m pip install -e .

      - name: Build the app (PyInstaller, universal2)
        working-directory: packaging
        env:
          SH_TARGET_ARCH: universal2
        run: python3 -m PyInstaller --noconfirm leather-drafting.spec

      - name: Verify it is a fat (universal2) binary
        working-directory: packaging
        run: |
          BIN="dist/Stitch Hero.app/Contents/MacOS/Stitch Hero"
          file "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "archs: $ARCHS"
          for a in x86_64 arm64; do
            echo "$ARCHS" | grep -qw "$a" || { echo "missing $a slice"; exit 1; }
          done

      - name: Smoke-test the build
        working-directory: packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "./dist/Stitch Hero.app/Contents/MacOS/Stitch Hero" --smoke
          echo "smoke test passed"

      - name: Package the .dmg
        working-directory: packaging
        run: |
          VER="${{ needs.version.outputs.version }}"
          STAGE="$(mktemp -d)"
          cp -R "dist/Stitch Hero.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"      # drag-to-install target
          mkdir -p installer
          hdiutil create -volname "Stitch Hero" -srcfolder "$STAGE" \
            -ov -format UDZO \
            "installer/Stitch-Hero-${VER}-macOS-universal.dmg"
          ls -lh installer

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: packaging/installer/*.dmg
          if-no-files-found: error

  release:
    needs: [version, windows, macos]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out (for the bundled manual PDF)
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Stitch Hero ${{ needs.version.outputs.version }}
          files: |
            dist/*.exe
            dist/*.dmg
            docs/Stitch-Hero-Manual.pdf
          generate_release_notes: true
          fail_on_unmatched_files: true
