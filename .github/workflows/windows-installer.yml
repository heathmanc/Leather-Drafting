name: Windows installer

# Builds a downloadable Windows setup program (Leather-Drafting-Setup-<ver>.exe)
# and publishes it as a public GitHub Release asset.
#
#   * Push a tag like v0.2.0            -> builds + publishes a Release.
#   * Actions -> "Windows installer" -> Run workflow  (pick a version) ->
#     builds and (by default) publishes a Release you can share with anyone.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (no leading v), e.g. 0.2.0"
        required: true
        default: "0.2.0"
      publish:
        description: "Publish a public GitHub Release (uncheck to only build the artifact)"
        type: boolean
        default: true

permissions:
  contents: write        # needed to create/update the Release

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"; V="${V#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"     >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.5" pyinstaller
          python -m pip install -e .

      - name: Build the app with PyInstaller
        working-directory: packaging
        run: pyinstaller --noconfirm leather-drafting.spec

      - name: Smoke-test the build
        working-directory: packaging
        shell: pwsh
        run: |
          # A windowed exe detaches from the shell, so wait for it explicitly
          # and check its real exit code (main() returns 0 on --smoke).
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath ".\dist\Leather-Drafting\Leather-Drafting.exe" `
                 -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "Smoke test failed with exit code $($p.ExitCode)"
            exit 1
          }
          Write-Host "smoke test passed"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        working-directory: packaging
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Leather-Drafting-Setup-${{ steps.ver.outputs.version }}
          path: packaging/installer/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Leather-Drafting ${{ steps.ver.outputs.version }}
          files: packaging/installer/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
