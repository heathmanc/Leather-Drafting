[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leathercad"
version = "0.2.0"
description = "Python CAD for laser-cut leather patterns with pricking-iron-accurate stitch hole spacing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "heathmanc" }]
keywords = ["leather", "cad", "laser", "stitching", "pricking-iron", "svg", "dxf"]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.0", "PySide6>=6.5"]

[project.scripts]
stitch-hero = "leathercad_app.__main__:main"

[tool.setuptools]
packages = ["leathercad", "leathercad_app"]

[tool.setuptools.package-data]
leathercad_app = ["resources/*.png", "resources/fonts/*.ttf",
                  "resources/fonts/LICENSE-DejaVu.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
