[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leathercad"
version = "0.1.0"
description = "Python CAD core for laser-cut leather patterns with pricking-iron-accurate stitch hole spacing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "heathmanc" }]
keywords = ["leather", "cad", "laser", "stitching", "pricking-iron", "svg"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["leathercad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
